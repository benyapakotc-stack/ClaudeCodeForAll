  <g stroke="#5e9a22" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M84 108 L102 100"/>
    <path d="M106 112 L124 108"/>
    <path d="M70 108 L82 114"/>
  </g>

  <!-- ยอดฟักทอง -->
  <g fill="#3f7a1a" stroke="#2a5410" stroke-width="1.2" stroke-linejoin="round">
    <path d="M92 94 C94 84 108 82 112 90 C108 98 98 98 92 94 Z"/>
    <path d="M132 94 C134 86 146 86 148 94 C144 100 136 100 132 94 Z"/>
