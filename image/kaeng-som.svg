  <!-- กุ้ง -->
  <g>
    <path d="M74 86 C66 64 104 54 122 72 C128 80 124 90 116 94 C114 84 100 76 88 82 C84 84 80 88 74 86 Z" fill="url(#shrimp)" stroke="#c8431f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M86 68 C89 74 89 80 86 84 M98 64 C102 70 102 76 99 81 M110 66 C114 72 114 78 111 84" fill="none" stroke="#c8431f" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    <path d="M118 72 L134 64 L128 80 L138 82 L122 88 Z" fill="#ef7a4d" stroke="#c8431f" stroke-width="1.5" stroke-linejoin="round"/>
