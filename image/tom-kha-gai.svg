<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ต้มข่าไก่">
  <defs>
    <radialGradient id="tk-broth" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f7ead0"/>
      <stop offset="1" stop-color="#ecd6a8"/>
    </radialGradient>
    <linearGradient id="tk-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="1" stop-color="#e3d2b0"/>
    </linearGradient>
  </defs>

  <!-- ไอร้อน -->
  <g fill="none" stroke="#c9b9a0" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M72 62 C62 48 82 40 72 26"/>
    <path d="M102 58 C92 42 112 34 102 18"/>
    <path d="M132 62 C122 48 142 40 132 26"/>
  </g>

  <!-- ชาม -->
  <path d="M18 100 H182 C182 150 150 182 100 182 C50 182 18 150 18 100 Z" fill="url(#tk-bowl)" stroke="#cdb98f" stroke-width="2"/>
  <path d="M70 184 H130 L126 192 H74 Z" fill="#cdb98f"/>
  <path d="M34 128 C60 142 140 142 166 128" fill="none" stroke="#c9a04a" stroke-width="3" opacity=".6"/>

  <!-- น้ำซุปกะทิ -->
  <ellipse cx="100" cy="100" rx="82" ry="26" fill="#fdf6e6" stroke="#cdb98f" stroke-width="2"/>
  <ellipse cx="100" cy="101" rx="74" ry="21" fill="url(#tk-broth)"/>
  <!-- น้ำมันพริกเผา -->
  <g fill="#e08a3a" opacity=".6">
    <ellipse cx="68" cy="108" rx="7" ry="2.2"/><ellipse cx="134" cy="112" rx="8" ry="2.2"/><ellipse cx="104" cy="118" rx="5" ry="1.8"/>
  </g>

  <!-- ไก่ -->
  <g fill="#fbe9c4" stroke="#cfae7a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M76 92 C80 82 96 80 102 88 C104 98 88 102 78 98 Z"/>
    <path d="M118 94 C122 86 138 86 142 94 C142 102 126 106 118 100 Z"/>
    <path d="M94 106 C96 100 108 100 112 106 C110 112 98 114 94 106 Z"/>
  </g>

  <!-- เห็ดฟาง -->
  <g>
    <path d="M52 104 C52 92 74 92 74 104 Z" fill="#cdbfa8" stroke="#8f7a56" stroke-width="1.5"/>
    <rect x="58" y="103" width="10" height="9" rx="3" fill="#f3ead6" stroke="#8f7a56" stroke-width="1.5"/>
    <path d="M142 112 C142 100 164 100 164 112 Z" fill="#cdbfa8" stroke="#8f7a56" stroke-width="1.5"/>
    <rect x="148" y="111" width="10" height="8" rx="3" fill="#f3ead6" stroke="#8f7a56" stroke-width="1.5"/>
  </g>

  <!-- ข่า -->
  <g fill="#f3dfae" stroke="#c9a85a" stroke-width="1.5">
    <ellipse cx="112" cy="84" rx="9" ry="5" transform="rotate(-18 112 84)"/>
    <ellipse cx="84" cy="116" rx="8" ry="4.5" transform="rotate(14 84 116)"/>
    <ellipse cx="128" cy="116" rx="8" ry="4.5" transform="rotate(-8 128 116)"/>
  </g>

  <!-- ตะไคร้ -->
  <g stroke-linecap="round" fill="none">
    <path d="M110 112 L160 96" stroke="#d9d98a" stroke-width="6"/>
    <path d="M110 112 L160 96" stroke="#a7a94c" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>

  <!-- ใบมะกรูด -->
  <g fill="#4e8a1c" stroke="#2f5d0e" stroke-width="1.2">
    <path d="M86 80 C92 68 108 72 108 82 C98 88 90 86 86 80 Z"/>
    <path d="M44 96 C50 88 62 90 64 98 C56 102 50 102 44 96 Z"/>
  </g>

  <!-- พริก -->
  <g stroke="#8f1d10" stroke-width="1.4" stroke-linecap="round">
    <path d="M124 80 C134 76 142 82 146 90 C138 88 130 86 124 80 Z" fill="#e0301f"/>
    <path d="M60 116 C54 112 46 114 42 120 C50 122 56 122 60 116 Z" fill="#e0301f"/>
  </g>

  <!-- ผักชี -->
  <g fill="#5fa02a" stroke="#3a7415" stroke-width="1">
    <path d="M98 94 C94 88 100 84 104 88 C108 84 112 90 108 94 C104 98 100 98 98 94 Z"/>
    <path d="M72 112 C68 106 74 102 78 106 C82 102 86 108 82 112 C78 116 74 116 72 112 Z"/>
  </g>
</svg>
